<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#05070d">
<title>NEXORA - Toko Online</title>
<style id="css">
:root{--bg:#05070d;--cd:#0b1020;--ln:#12306b;--n:#00b3ff;--n2:#00e5ff;--tx:#e8f4ff;--mu:#8aa4c4;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(0,179,255,.18),transparent 45%),radial-gradient(circle at 85% 60%,rgba(0,229,255,.1),transparent 40%);pointer-events:none;z-index:-1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(5,7,13,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:3px;font-size:18px}
.logo svg,.bl{filter:drop-shadow(0 0 8px var(--n))}
.logo span,h1 span{color:var(--n);text-shadow:0 0 12px var(--n)}
.cb{position:relative;background:none;border:1px solid var(--n);color:var(--n);border-radius:12px;padding:8px 12px;font-size:18px;cursor:pointer;box-shadow:0 0 12px rgba(0,179,255,.35)}
.cb i{position:absolute;top:-8px;right:-8px;background:var(--n);color:#000;font:700 11px system-ui;border-radius:99px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.hero{min-height:78vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 20px}
.bl{animation:fl 4s ease-in-out infinite}
h1{font-size:clamp(34px,10vw,56px);letter-spacing:4px;margin-top:14px}
h1 span{animation:gl 2.5s ease-in-out infinite}
.hero p{color:var(--mu);max-width:420px;margin:12px 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border:none;border-radius:14px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .2s}
.btn:active{transform:scale(.96)}
.pr{background:linear-gradient(135deg,var(--n),var(--n2));color:#001018;box-shadow:0 0 22px rgba(0,179,255,.6)}
.gh{background:none;color:var(--n);border:1px solid var(--n);box-shadow:0 0 14px rgba(0,179,255,.3)}
.w{width:100%;margin-top:14px}
.promo{margin:0 16px;padding:12px 16px;border:1px solid var(--n);border-radius:14px;text-align:center;color:var(--n2);box-shadow:0 0 18px rgba(0,179,255,.3);animation:gl 3s infinite}
section{padding:40px 16px;max-width:1000px;margin:auto}
h2{font-size:26px}
h2::after{content:"";display:block;width:60px;height:3px;margin:8px 0 18px;background:var(--n);box-shadow:0 0 12px var(--n);border-radius:3px}
input,textarea,select{width:100%;background:var(--cd);border:1px solid var(--ln);border-radius:10px;color:var(--tx);padding:12px;margin-top:8px;font:15px inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--n);box-shadow:0 0 10px rgba(0,179,255,.4)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--ln);background:none;color:var(--mu);cursor:pointer}
.chip.on{border-color:var(--n);color:var(--n);box-shadow:0 0 10px rgba(0,179,255,.4)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px;display:flex;flex-direction:column;transition:.25s;animation:rs .6s both}
.card:hover{transform:translateY(-4px);border-color:var(--n);box-shadow:0 0 22px rgba(0,179,255,.35)}
.card.sold{opacity:.55}
.th{height:96px;border-radius:12px;background:radial-gradient(circle,rgba(0,179,255,.25),transparent 70%);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:10px;overflow:hidden}
.th img,.e img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.card h3{font-size:15px}
.card small{color:var(--mu);font-size:12px;flex:1;margin:4px 0}
.pc{color:var(--n2);font-weight:700;margin:6px 0 10px}
.add{background:none;border:1px solid var(--n);color:var(--n);border-radius:10px;padding:9px;font-weight:700;cursor:pointer}
.add:disabled{border-color:var(--mu);color:var(--mu)}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:22px;box-shadow:0 0 24px rgba(0,179,255,.15)}
.stats{display:flex;gap:10px;margin-top:18px}
.stats div{flex:1;text-align:center;border:1px solid var(--ln);border-radius:14px;padding:12px 4px}
.stats b{display:block;color:var(--n);font-size:20px;text-shadow:0 0 10px var(--n)}
.stats span{font-size:11px;color:var(--mu)}
footer{text-align:center;padding:30px 16px 40px;color:var(--mu);font-size:13px;border-top:1px solid var(--ln)}
#own{margin-top:18px;text-align:left;border:1px dashed var(--n);border-radius:14px;padding:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s;z-index:30}
.ov.sh{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;height:100%;width:min(94%,400px);background:#070b17;border-left:1px solid var(--n);z-index:40;transform:translateX(105%);transition:.35s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,179,255,.25)}
.dr.sh{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--ln)}
.db{flex:1;overflow-y:auto;padding:14px}
.x{background:none;border:none;color:var(--tx);font-size:26px;cursor:pointer}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.e{width:40px;height:40px;font-size:28px;display:flex;align-items:center;justify-content:center}
.t{flex:1;font-size:14px}.t small{color:var(--n2)}
.qt{display:flex;align-items:center;gap:8px}
.qt button,.sm{border:1px solid var(--n);background:none;color:var(--n);border-radius:8px;cursor:pointer;font-weight:700}
.qt button{width:28px;height:28px}.sm{padding:7px 10px;font-size:12px}
.tot{display:flex;justify-content:space-between;font-weight:700;margin:12px 0;color:var(--n2)}
.em{text-align:center;color:var(--mu);padding:40px 0}
.ok{text-align:center;color:var(--mu)}.ok div{font-size:54px}.ok h3{color:var(--tx);margin:8px 0}.ok p{margin-bottom:16px}
.pay{border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:18px;text-align:left}
.pay img{display:block;width:100%;max-width:260px;margin:12px auto 4px;border-radius:12px;background:#fff}
.pay .it b{color:var(--n2)}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-30px);background:#071a33;border:1px solid var(--n);padding:12px 18px;border-radius:14px;z-index:60;opacity:0;transition:.4s;box-shadow:0 0 24px rgba(0,179,255,.6);max-width:90%;text-align:center}
.toast.sh{opacity:1;transform:translate(-50%,0)}
.th{position:relative}.lb{position:absolute;top:6px;left:6px;background:var(--n);color:#001018;font:700 10px system-ui;padding:2px 8px;border-radius:99px;box-shadow:0 0 10px var(--n)}
.pc s{color:var(--mu);font-weight:400;font-size:12px;margin-left:6px}
.vrow{display:flex;gap:8px;align-items:center}.vrow input{margin:8px 0 0}
@keyframes fl{50%{transform:translateY(-12px)}}
@keyframes gl{50%{text-shadow:0 0 30px var(--n2),0 0 60px var(--n);box-shadow:0 0 28px rgba(0,229,255,.5)}}
@keyframes rs{from{opacity:0;transform:translateY(20px)}}
</style></head><body><div id="root"></div>
<script type="application/json" id="data">{"nama":"NEXORA","wa":"6281234567890","tentang":"NEXORA adalah toko online yang menghadirkan produk berkualitas dengan pelayanan cepat dan ramah. Belanja jadi mudah, aman, dan menyenangkan langsung dari HP kamu.","promo":"Selamat datang! Pesan sekarang, pesanan dikirim lewat WhatsApp.","produk":[{"id":"p1","nama":"Headset Neon X","harga":250000,"stok":null,"kat":"","desk":"Suara jernih, bass mantap","emoji":"🎧","foto":""},{"id":"p2","nama":"Smartwatch Pro","harga":450000,"stok":null,"kat":"","desk":"Pantau aktivitas harian","emoji":"⌚","foto":""},{"id":"p3","nama":"Powerbank 20000","harga":180000,"stok":null,"kat":"","desk":"Fast charging tahan lama","emoji":"🔋","foto":""},{"id":"p4","nama":"Keyboard RGB","harga":320000,"stok":null,"kat":"","desk":"Lampu biru, klik nyaman","emoji":"⌨️","foto":""},{"id":"p5","nama":"Speaker Mini","harga":150000,"stok":null,"kat":"","desk":"Kecil, suara besar","emoji":"🔊","foto":""},{"id":"p6","nama":"Kamera Action","harga":600000,"stok":null,"kat":"","desk":"Rekam petualanganmu","emoji":"📷","foto":""}],"bayar":{"qris":"","metode":[],"catatan":""}}</script>
<script id="app">
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp "+Number(n||0).toLocaleString("id-ID");
const ls={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let D=JSON.parse($("#data").textContent);
D.bayar=D.bayar||{qris:"",metode:[],catatan:""};
D.voucher=D.voucher||[];
let cart=ls.g("cart",{}),kat="Semua",cari="",cats=[],vc=null;
const P=id=>D.produk.find(p=>p.id===id);
const gbr=p=>p.foto?'<img src="'+p.foto+'" alt="">':esc(p.emoji||"🛍️");
const LOGO=(w,s,c)=>'<svg class="'+c+'" width="'+w+'" height="'+w+'" viewBox="0 0 64 64" fill="none"><path d="M32 4 56 18v28L32 60 8 46V18z" stroke="#00b3ff" stroke-width="'+s+'"/><path d="M22 44V20l20 24V20" stroke="#00e5ff" stroke-width="'+(s+1.5)+'" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const nm=()=>{const n=esc(D.nama);return n.length>3?n.slice(0,3)+"<span>"+n.slice(3)+"</span>":n};
function tt(m){const t=$("#ts");t.textContent=m;t.classList.add("sh");clearTimeout(tt.x);tt.x=setTimeout(()=>t.classList.remove("sh"),3000)}

/* Susunan halaman */
$("#root").innerHTML='<header><div class="logo">'+LOGO(32,3,"")+'<div>'+nm()+'</div></div><button class="cb" id="oc">🛒<i id="bg">0</i></button></header>'+
'<div class="hero">'+LOGO(104,2.5,"bl")+'<h1>'+nm()+'</h1><p>Belanja mudah, cepat, dan aman langsung dari HP kamu.</p><div class="btns"><a class="btn pr" href="#produk">Mulai</a><a class="btn gh" href="#tentang">Tentang Kami</a></div></div>'+
(D.promo?'<div class="promo">📣 '+esc(D.promo)+'</div>':'')+
'<section id="produk"><h2>Produk</h2><input id="q" placeholder="🔍 Cari produk..."><div class="chips" id="ch"></div><div class="grid" id="gr"></div></section>'+
'<section id="tentang"><h2>Tentang Kami</h2><div class="box"><p>'+esc(D.tentang)+'</p><div class="stats"><div><b>'+D.produk.length+'</b><span>Produk</span></div><div><b>24/7</b><span>Pesan Kapan Saja</span></div><div><b>💬</b><span>Respon via WhatsApp</span></div></div></div></section>'+
'<footer>© '+new Date().getFullYear()+' '+esc(D.nama)+'<div id="own" hidden><b>🔧 Pemilik: perbarui toko</b><br><small>Di web Admin buka tab Toko, ketuk Salin data toko, lalu tempel di sini.</small><textarea id="pj" rows="3" placeholder="Tempel data dari Admin"></textarea><button class="btn pr w" id="pb">Terbitkan ke pelanggan</button></div></footer>'+
'<div class="ov" id="ov"></div><aside class="dr" id="dr"><div class="dh"><b>Keranjang</b><button class="x" id="cx">×</button></div><div class="db" id="cb"></div></aside><div class="toast" id="ts"></div>';

/* Daftar produk */
function rg(){
  cats=["Semua"].concat([...new Set(D.produk.map(p=>p.kat).filter(Boolean))]);
  $("#ch").hidden=cats.length<2;
  $("#ch").innerHTML=cats.map((c,i)=>'<button class="chip '+(c===kat?"on":"")+'" onclick="sk('+i+')">'+esc(c)+'</button>').join("");
  const l=D.produk.filter(p=>(kat==="Semua"||p.kat===kat)&&(p.nama+" "+(p.desk||"")).toLowerCase().includes(cari));
  $("#gr").innerHTML=l.length?l.map((p,i)=>{const h=p.stok!=null&&p.stok<=0;
    return '<div class="card '+(h?"sold":"")+'" style="animation-delay:'+i*.06+'s"><div class="th">'+(p.label?'<span class="lb">'+esc(p.label)+'</span>':'')+gbr(p)+'</div><h3>'+esc(p.nama)+'</h3><small>'+esc(p.desk)+(p.stok!=null&&p.stok>0&&p.stok<=5?" · sisa "+p.stok:"")+'</small><div class="pc">'+rp(p.harga)+(p.coret>p.harga?'<s>'+rp(p.coret)+'</s>':'')+'</div><button class="add" '+(h?"disabled":"")+' onclick="tb(\''+p.id+'\')">'+(h?"Stok habis":"+ Keranjang")+'</button></div>'}).join(""):'<div class="em" style="grid-column:1/-1">Produk tidak ditemukan</div>';
}
function sk(i){kat=cats[i];rg()}
$("#q").oninput=e=>{cari=e.target.value.toLowerCase();rg()};

/* Keranjang */
function sv(){ls.s("cart",cart);$("#bg").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function op(v){$("#dr").classList.toggle("sh",v);$("#ov").classList.toggle("sh",v)}
$("#oc").onclick=()=>{rc();op(true)};
$("#cx").onclick=$("#ov").onclick=()=>op(false);
function tb(id){const p=P(id),n=(cart[id]||0)+1;if(!p)return;if(p.stok!=null&&n>p.stok){tt("Stok terbatas");return}cart[id]=n;sv();tt("Ditambahkan ke keranjang ✓")}
function ub(id,d){const p=P(id),n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(p.stok!=null&&n>p.stok){tt("Stok terbatas");return}else cart[id]=n;sv();ri()}
function disk(sub){if(!vc||sub<(vc.min||0))return 0;return Math.min(sub,vc.tipe==="persen"?Math.round(sub*vc.nilai/100):vc.nilai)}
function pv(){
  const k=$("#vk").value.trim().toUpperCase(),v=D.voucher.find(x=>x.kode.toUpperCase()===k);
  if(!v){vc=null;tt(k?"Kode voucher tidak valid":"Masukkan kode voucher dulu");ri();return}
  vc=v;const sub=Object.keys(cart).reduce((s,id)=>s+(P(id)?P(id).harga*cart[id]:0),0);
  tt(sub<(v.min||0)?"Minimal belanja "+rp(v.min):"Voucher dipakai ✓");ri();
}
function ri(){
  const it=Object.keys(cart).map(id=>[P(id),cart[id],id]).filter(x=>x[0]);
  const sub=it.reduce((s,x)=>s+x[0].harga*x[1],0),ds=disk(sub),tot=sub-ds;
  $("#ci").innerHTML=it.length?it.map(x=>'<div class="it"><div class="e">'+gbr(x[0])+'</div><div class="t">'+esc(x[0].nama)+'<br><small>'+rp(x[0].harga)+'</small></div><div class="qt"><button onclick="ub(\''+x[2]+'\',-1)">−</button><b>'+x[1]+'</b><button onclick="ub(\''+x[2]+'\',1)">+</button></div></div>').join("")+(ds?'<div style="display:flex;justify-content:space-between;color:var(--mu)"><span>Subtotal</span><span>'+rp(sub)+'</span></div><div style="display:flex;justify-content:space-between;color:#2ee6a6"><span>Diskon '+esc(vc.kode)+'</span><span>−'+rp(ds)+'</span></div>':'')+'<div class="tot"><span>Total</span><span>'+rp(tot)+'</span></div>':'<div class="em">Keranjang masih kosong 🛒</div>';
}
function rc(){
  const c=ls.g("cust",{}),mt=[];
  if(D.bayar.qris)mt.push("QRIS");
  (D.bayar.metode||[]).forEach(m=>mt.push(m.nama));
  mt.push("Bayar di tempat (COD)");
  $("#cb").innerHTML='<div id="ci"></div><div class="vrow"><input id="vk" placeholder="Kode voucher (opsional)" value="'+esc(vc?vc.kode:"")+'"><button class="sm" onclick="pv()">Pakai</button></div><input id="nm" placeholder="Nama kamu" value="'+esc(c.n)+'"><input id="hp" type="tel" placeholder="No. HP / WhatsApp" value="'+esc(c.h)+'"><textarea id="al" rows="2" placeholder="Email / alamat penerima (opsional untuk produk digital)">'+esc(c.a)+'</textarea><input id="ct" placeholder="Catatan (opsional)"><select id="by">'+mt.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select><button class="btn pr w" onclick="pesan()">Lanjut Pesan</button>';
  ri();
}
function pesan(){
  const n=$("#nm").value.trim(),h=$("#hp").value.trim(),a=$("#al").value.trim(),c=$("#ct").value.trim(),b=$("#by").value;
  const it=Object.keys(cart).map(id=>[P(id),cart[id]]).filter(x=>x[0]);
  if(!it.length){tt("Keranjang masih kosong");return}
  if(!n||!h){tt("Isi nama dan no. HP dulu ya");return}
  const sub=it.reduce((s,x)=>s+x[0].harga*x[1],0),ds=disk(sub),tot=sub-ds,inv="INV-"+Date.now().toString(36).toUpperCase().slice(-6);
  const t="Halo "+D.nama+", saya mau pesan:\nNo. Pesanan: "+inv+"\n"+it.map(x=>"- "+x[0].nama+" x"+x[1]+" = "+rp(x[0].harga*x[1])).join("\n")+(ds?"\nVoucher: "+vc.kode:"")+"\nTotal: "+rp(tot)+"\nNama: "+n+"\nHP: "+h+"\nAlamat: "+(a||"-")+"\nCatatan: "+(c||"-")+"\nPembayaran: "+b+"\nKODE: "+it.map(x=>x[0].id+"*"+x[1]).join(",");
  ls.s("cust",{n:n,h:h,a:a});cart={};vc=null;sv();
  $("#cb").innerHTML='<div class="ok"><div>✅</div><h3>Pesanan siap dikirim</h3><p>No. Pesanan <b>'+inv+'</b><br>Ketuk tombol di bawah untuk mengirim pesanan ke WhatsApp penjual.</p><a class="btn pr" target="_blank" rel="noopener" href="https://wa.me/'+esc(D.wa)+'?text='+encodeURIComponent(t)+'">Kirim via WhatsApp</a><br><br><a class="btn gh" target="_blank" rel="noopener" href="https://wa.me/'+esc(D.wa)+'?text='+encodeURIComponent("Halo, ini bukti pembayaran untuk pesanan "+inv+" a.n. "+n)+'">📎 Kirim bukti bayar</a></div>'+bayar();
}
function bayar(){
  const b=D.bayar;if(!b.qris&&!(b.metode||[]).length)return"";
  return '<div class="pay"><b>💳 Cara Pembayaran</b>'+(b.qris?'<img src="'+b.qris+'" alt="QRIS"><small style="display:block;text-align:center;color:var(--mu)">Scan QRIS di atas</small>':'')+
  (b.metode||[]).map((m,i)=>'<div class="it"><div class="t"><b>'+esc(m.nama)+'</b><br>'+esc(m.nomor)+'<br><small style="color:var(--mu)">a.n. '+esc(m.atas)+'</small></div><button class="sm" onclick="sn('+i+')">Salin</button></div>').join("")+
  (b.catatan?'<p style="margin-top:10px;font-size:13px;color:var(--mu)">'+esc(b.catatan)+'</p>':'')+'</div>';
}
function sn(i){const n=D.bayar.metode[i]&&D.bayar.metode[i].nomor;if(!n)return;(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>tt("Nomor disalin ✓")).catch(()=>tt("Tekan lama nomornya lalu salin"))}

/* Pemilik: terbitkan data baru dari Admin */
function bangun(s){
  const j=JSON.stringify(s).replace(/</g,"\\u003c"),X="<\/script>",O="<scr"+"ipt";
  return "<!DOCTYPE html>\n<html lang=\"id\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><meta name=\"color-scheme\" content=\"dark\"><meta name=\"theme-color\" content=\"#05070d\"><title>"+esc(s.nama)+" - Toko Online</title><style id=\"css\">"+$("#css").textContent+"</style></head><body><div id=\"root\"></div>"+O+" type=\"application/json\" id=\"data\">"+j+X+O+" id=\"app\">"+$("#app").textContent+X+"</body></html>";
}
(async()=>{try{if(typeof claude==="undefined")return;const u=await claude.use("user");if(u&&await u.canEdit())$("#own").hidden=false}catch(e){}})();
$("#pb").onclick=async()=>{
  try{
    const j=JSON.parse($("#pj").value);
    if(!j||!Array.isArray(j.produk))throw 0;
    const art=await claude.use("artifact");
    if(!art){tt("Penerbitan tidak tersedia di sini");return}
    tt("Menerbitkan...");
    await art.publish(bangun(Object.assign({},D,j)));
  }catch(e){
    tt(e&&e.code==="not_writer"?"Hanya pemilik yang bisa menerbitkan":e&&e.code==="conflict"?"Ada versi baru, halaman dimuat ulang":"Data tidak valid atau gagal terbit");
  }
};
rg();sv();
</script></body></html>
